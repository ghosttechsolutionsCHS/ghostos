name: Marketing nav hotfix

on:
  push:
    paths:
      - '.github/workflows/marketing-nav-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Route Marketing tab to review center
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/command-center.html')
          s = p.read_text()
          old = "if(nav){setView(nav.dataset.view);return}"
          new = "if(nav){if(nav.dataset.view==='marketing'){location.href='/marketing.html';return}setView(nav.dataset.view);return}"
          if new not in s:
              if old not in s:
                  raise SystemExit('Expected navigation code not found')
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY
      - name: Commit hotfix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'ghostos-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/command-center.html
          git commit -m 'fix: route Marketing tab to review center'
          git push
