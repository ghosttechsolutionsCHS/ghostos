name: Marketing approval edit hotfix

on:
  push:
    paths:
      - '.github/workflows/marketing-approval-edit-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add save-edit support
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/daily-marketing.js')
          s=p.read_text()
          old="export async function decideMarketingItem({id,decision,edit=''}){if(!id||!['Approved','Rejected'].includes(decision))throw new Error('id and Approved/Rejected decision are required');const rows=await listRecords(TABLES.GROWTH_WORK,{maxRecords:300});const row=rows.find(r=>r.id===id);if(!row||!isMarketingItem(row))throw new Error('Marketing approval item not found');const f=row.fields||{};if(selectName(f['Owner Decision'])!=='Pending')throw new Error(`Marketing item is already ${selectName(f['Owner Decision'])||'resolved'}`);const now=new Date().toISOString(),isSocial=['Instagram','Facebook','Instagram + Facebook'].includes(String(f.Platform||'')),executable=Boolean(f['Execution Connector']&&f['Execution Action']&&f['Execution Payload JSON']),scheduled=Boolean(f['Scheduled At']);const fields={'Owner Decision':decision,'Updated At':now,Status:decision==='Approved'?'Ready for Owner':'Rejected','Execution Status':decision==='Rejected'?'Failed — Owner Attention':executable?(scheduled?'Scheduled':'Approved'):'Approved','Publishing Status':decision==='Rejected'?'Rejected':isSocial?(executable?'Approved — Ready for Connected Publish':'Approved — Publishing Connection Required'):undefined};if(edit){fields['Owner Edit']=clean(edit);if(executable){const edited=withOwnerEdit(String(f['Execution Action']),executionPayload(f['Execution Payload JSON']),edit);validateExecutionSpec({connector:String(f['Execution Connector']),action:String(f['Execution Action']),payload:edited});fields['Execution Payload JSON']=JSON.stringify(edited)}}await updateRecord(TABLES.GROWTH_WORK,id,fields);await logActivity({agent:'ATLAS',actionType:'marketing_owner_decision',status:decision==='Approved'?'Done':'Blocked',detail:`${decision}: ${f['Growth Item']||id}. Executable=${executable}; nothing was executed by the approval request itself.`,consequential:true});return {id,decision,published:false,executable,executionStatus:fields['Execution Status'],publishingStatus:fields['Publishing Status']||null}}"
          new="export async function decideMarketingItem({id,decision,edit=''}){if(!id||!['Approved','Rejected','Edit'].includes(decision))throw new Error('id and Approved/Rejected/Edit decision are required');const rows=await listRecords(TABLES.GROWTH_WORK,{maxRecords:300});const row=rows.find(r=>r.id===id);if(!row||!isMarketingItem(row))throw new Error('Marketing approval item not found');const f=row.fields||{};if(selectName(f['Owner Decision'])!=='Pending')throw new Error(`Marketing item is already ${selectName(f['Owner Decision'])||'resolved'}`);const now=new Date().toISOString(),isSocial=['Instagram','Facebook','Instagram + Facebook'].includes(String(f.Platform||'')),executable=Boolean(f['Execution Connector']&&f['Execution Action']&&f['Execution Payload JSON']),scheduled=Boolean(f['Scheduled At']);if(decision==='Edit'){if(!String(edit||'').trim())throw new Error('Edit text is required');const fields={'Owner Edit':clean(edit),'Updated At':now,Status:'Needs Owner','Owner Decision':'Pending','Execution Status':'Awaiting Owner','Publishing Status':isSocial?'Draft — Owner Review':undefined};if(executable){const edited=withOwnerEdit(String(f['Execution Action']),executionPayload(f['Execution Payload JSON']),edit);validateExecutionSpec({connector:String(f['Execution Connector']),action:String(f['Execution Action']),payload:edited});fields['Execution Payload JSON']=JSON.stringify(edited)}await updateRecord(TABLES.GROWTH_WORK,id,fields);await logActivity({agent:'ATLAS',actionType:'marketing_owner_edit',status:'Blocked',detail:`Owner edited: ${f['Growth Item']||id}. Still awaiting approval; nothing was executed.`,consequential:true});return {id,decision:'Edit',saved:true,published:false,pending:true}}const fields={'Owner Decision':decision,'Updated At':now,Status:decision==='Approved'?'Ready for Owner':'Rejected','Execution Status':decision==='Rejected'?'Failed — Owner Attention':executable?(scheduled?'Scheduled':'Approved'):'Approved','Publishing Status':decision==='Rejected'?'Rejected':isSocial?(executable?'Approved — Ready for Connected Publish':'Approved — Publishing Connection Required'):undefined};if(edit){fields['Owner Edit']=clean(edit);if(executable){const edited=withOwnerEdit(String(f['Execution Action']),executionPayload(f['Execution Payload JSON']),edit);validateExecutionSpec({connector:String(f['Execution Connector']),action:String(f['Execution Action']),payload:edited});fields['Execution Payload JSON']=JSON.stringify(edited)}}await updateRecord(TABLES.GROWTH_WORK,id,fields);await logActivity({agent:'ATLAS',actionType:'marketing_owner_decision',status:decision==='Approved'?'Done':'Blocked',detail:`${decision}: ${f['Growth Item']||id}. Executable=${executable}; nothing was executed by the approval request itself.`,consequential:true});return {id,decision,published:false,executable,executionStatus:fields['Execution Status'],publishingStatus:fields['Publishing Status']||null}}"
          if old not in s:
              raise SystemExit('Target function not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit hotfix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'ghostos-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/daily-marketing.js
          git commit -m 'feat: support saved edits before marketing approval'
          git push
