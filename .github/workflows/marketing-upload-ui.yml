name: Marketing Upload UI Patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marketing-upload-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add manual image upload controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/marketing.html')
          s=p.read_text()
          css_old='.mediaTools{display:flex;gap:7px;margin-top:8px}.mediaTools button{flex:1}'
          css_new='.mediaTools{display:flex;gap:7px;margin-top:8px}.mediaTools button{flex:1}.uploadBox{border:1px dashed #52668e;border-radius:16px;padding:12px;margin:10px 0;background:#0b1220}.uploadTitle{font-weight:900;color:#eef3ff;margin-bottom:4px}.uploadHint{font-size:11px;color:#97a3bd;margin-bottom:9px}.uploadBtn{display:block;width:100%;text-align:center;border-radius:13px;padding:11px 10px;font-weight:900;color:#06150e;background:linear-gradient(135deg,#39d98a,#56e6a6);cursor:pointer}.uploadInput{display:none}.uploadPlaceholder{text-align:center;color:#7f8aa4;padding:38px 16px;border-radius:14px;background:#08101d}.uploadedPreview{width:100%;height:auto;display:block;border-radius:15px;background:#0b1220}'
          if css_old not in s: raise SystemExit('css anchor not found')
          s=s.replace(css_old,css_new,1)
          old='<section class="hero"><div class="eyebrow">Marketing</div><h1>Review exactly what will post.</h1><p>The preview is the proposed customer-facing creative. Tap any picture to open it full size, save it, then approve, edit, or reject it.</p></section>'
          new='<section class="hero"><div class="eyebrow">Marketing</div><h1>Review the copy. Add your image.</h1><p>GhostOS prepares the caption, Story copy, CTA and hashtags. Tap Upload image on any Facebook or Instagram card to choose the picture you want to use.</p></section>'
          if old not in s: raise SystemExit('hero anchor not found')
          s=s.replace(old,new,1)
          old2='<div class="previewLabel">PREVIEW — THIS IS WHAT CUSTOMERS WILL SEE</div><div class="customerPreview">${media(row)}</div>'
          new2='<div class="previewLabel">IMAGE FOR THIS ${/story/i.test(type)?\'STORY\':\'POST\'}</div><div class="uploadBox"><div class="uploadTitle">Upload your image</div><div class="uploadHint">Choose the finished picture from your phone. GhostOS will preview it here for this review session.</div><label class="uploadBtn" for="upload-${esc(row.id)}">＋ Upload image</label><input class="uploadInput" id="upload-${esc(row.id)}" type="file" accept="image/*" data-upload-id="${esc(row.id)}"></div><div class="customerPreview" data-upload-preview="${esc(row.id)}"><div class="uploadPlaceholder">No image uploaded yet.</div></div>'
          if old2 not in s: raise SystemExit('social card anchor not found')
          s=s.replace(old2,new2,1)
          old3="document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');"
          add="document.addEventListener('change',e=>{const input=e.target.closest('[data-upload-id]');if(!input)return;const file=input.files&&input.files[0];if(!file)return;const target=document.querySelector(`[data-upload-preview=\"${CSS.escape(input.dataset.uploadId)}\"]`);if(!target)return;const url=URL.createObjectURL(file);target.innerHTML=`<img class=\"uploadedPreview\" src=\"${url}\" alt=\"Uploaded marketing image\">`;target.querySelector('img').addEventListener('click',()=>openAsset(url));});\n"
          if old3 not in s: raise SystemExit('click anchor not found')
          s=s.replace(old3,add+old3,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'ghosttechsolutionsCHS'
          git config user.email 'ghosttechsolutionschs@gmail.com'
          git add public/marketing.html
          git commit -m 'feat: add manual image upload to social review cards' || exit 0
          git push
