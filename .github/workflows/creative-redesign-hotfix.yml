name: creative-redesign-hotfix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/creative-redesign-hotfix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Redesign Facebook and Instagram previews
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/marketing.html')
          s=p.read_text()
          new_frame=r'''function frameText(row,frame){const d=String(f(row,'Owner Edit')||f(row,'Draft Content')||'');const hit=[...d.matchAll(/Frame\s*([1-9])\s*:\s*([^\n]+)/gi)].find(x=>Number(x[1])===frame);if(hit)return hit[2];const title=shortTitle(row),low=(title+' '+d).toLowerCase();if(/wi-?fi|network|router/.test(low)){if(frame===1)return 'Wi-Fi strong by the router but weak across the house?';if(frame===2)return 'Dead zones usually mean your network needs better coverage — not just faster internet.';return 'We come to you. Message Ghost Tech for Wi-Fi & network help.'}if(/phone|iphone|screen|tablet/.test(low)){if(frame===1)return 'Cracked screen or phone acting up?';if(frame===2)return 'Skip the repair-shop wait. Ghost Tech brings mobile tech service to you.';return 'Message Ghost Tech for a fast local repair quote.'}if(/business|pos|office|it/.test(low)){if(frame===1)return 'Your business should not stop because the tech did.';if(frame===2)return 'POS, Wi-Fi, computers and networking — set up and supported on-site.';return 'Charleston businesses: message Ghost Tech for IT support.'}if(frame===1)return title;if(frame===2)return 'Local mobile tech help without the repair-shop hassle.';return f(row,'CTA')||'Message Ghost Tech to get started.'}'''
          s,n=re.subn(r"function frameText\(row,frame\)\{.*?\}\nfunction wrap",lambda m:new_frame+'\nfunction wrap',s,count=1,flags=re.S)
          assert n==1,'frameText not found'
          new_paint=r'''function paintCanvas(canvas,row,frame=1){const story=/story/i.test(f(row,'Content Type')),platform=f(row,'Platform')||'Ghost Tech';canvas.width=story?1080:(/^Facebook$/i.test(platform)?1200:1080);canvas.height=story?1920:1350;const w=canvas.width,h=canvas.height,ctx=canvas.getContext('2d');const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#020711');g.addColorStop(.5,'#071b42');g.addColorStop(1,'#02040a');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);const glow=ctx.createRadialGradient(w*.72,h*.32,20,w*.72,h*.32,w*.58);glow.addColorStop(0,'rgba(0,119,255,.34)');glow.addColorStop(1,'rgba(0,119,255,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);const pad=Math.round(w*.055),x=pad+42;ctx.strokeStyle='rgba(80,160,255,.45)';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(pad,pad,w-pad*2,h-pad*2,44);ctx.stroke();ctx.fillStyle='#f7fbff';ctx.font='900 40px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif';ctx.fillText('GHOST TECH SOLUTIONS',x,pad+76);ctx.fillStyle='#62b5ff';ctx.font='800 23px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif';ctx.fillText((platform.toUpperCase()+(story?'  •  STORY '+frame+'/3':'  •  CHARLESTON SC')),x,pad+122);const headline=story?frameText(row,frame):shortTitle(row);ctx.fillStyle='#fff';ctx.font=`900 ${story?82:70}px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif`;const lines=wrap(ctx,headline,w*.78,story?5:4);drawLines(ctx,lines,x,story?h*.25:h*.29,story?88:76);let supporting='';const low=(headline+' '+String(f(row,'Draft Content')||'')).toLowerCase();if(story){supporting=frame===1?'Fast, local help from a technician who comes to you.':frame===2?'Phones • Computers • Wi-Fi • Business IT':frameText(row,3)}else if(/business|network|wi-?fi|it/.test(low))supporting='On-site business IT, Wi-Fi, networking and device support across Charleston.';else supporting='Mobile tech repair and support — we come to you.';ctx.fillStyle='#c9d8f2';ctx.font=`600 ${story?34:30}px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif`;drawLines(ctx,wrap(ctx,supporting,w*.62,3),x,story?h*.53:h*.59,story?44:40);if(window.ghostMascot&&ghostMascot.complete&&ghostMascot.naturalWidth){const mw=story?w*.55:w*.42,mh=mw*(ghostMascot.naturalHeight/ghostMascot.naturalWidth),mx=w-mw-pad*.45,my=story?h-mh-pad*1.7:h-mh-pad*.85;ctx.globalAlpha=.98;ctx.drawImage(ghostMascot,mx,my,mw,mh);ctx.globalAlpha=1}const cta=f(row,'CTA')||(/business|network|wi-?fi|it/.test(low)?'Message us for on-site tech help':'Message us for a quick quote');const boxY=story?h*.78:h*.77,boxW=story?w*.62:w*.55;ctx.fillStyle='rgba(3,10,22,.92)';ctx.strokeStyle='#268cff';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(x,boxY,boxW,story?210:170,30);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.font=`800 ${story?31:28}px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif`;drawLines(ctx,wrap(ctx,cta,boxW-70,2),x+34,boxY+62,story?40:36);ctx.fillStyle='#7fbfff';ctx.font='700 22px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif';ctx.fillText('ghosttechsolution.com  •  843-973-4201',x+34,boxY+(story?160:128));}'''
          s,n=re.subn(r"function paintCanvas\(canvas,row,frame=1\)\{.*?\}\nfunction media\(row\)",lambda m:new_paint+'\nfunction media(row)',s,count=1,flags=re.S)
          assert n==1,'paintCanvas not found'
          marker="const $=id=>document.getElementById(id);let D=null,ROWS=new Map(),activeCanvas=null;"
          repl=marker+"const ghostMascot=new Image();ghostMascot.src='/assets/ghost-mascot.webp';window.ghostMascot=ghostMascot;ghostMascot.onload=()=>document.querySelectorAll('.creativeCanvas').forEach(c=>{const r=ROWS.get(c.dataset.id);if(r)paintCanvas(c,r,Number(c.dataset.frame||1))});"
          assert marker in s,'script marker not found'
          s=s.replace(marker,repl,1)
          p.write_text(s)
          PY
      - name: Commit redesign
        run: |
          git config user.name ghostos-bot
          git config user.email ghostos-bot@users.noreply.github.com
          git add public/marketing.html
          git commit -m "fix: redesign social previews with Ghost Tech mascot" || exit 0
          git push
