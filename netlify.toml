[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/ghostos"
  to = "/.netlify/functions/ghostos"
  status = 200

[[redirects]]
  from = "/api/dashboard"
  to = "/.netlify/functions/dashboard"
  status = 200

[[redirects]]
  from = "/api/approval"
  to = "/.netlify/functions/approval"
  status = 200

[[redirects]]
  from = "/api/relay-message"
  to = "/.netlify/functions/relay-message"
  status = 200

[[redirects]]
  from = "/api/builder"
  to = "/.netlify/functions/builder"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard-v3.html"
  status = 200
