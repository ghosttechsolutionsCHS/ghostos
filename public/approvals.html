<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b10"><title>GhostOS Approvals</title><style>html,body{margin:0;min-height:100%;background:#070a0f;color:#f7f9fd;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{min-height:100dvh;display:grid;place-items:center;color:#8e9aaf}</style></head><body><div class="boot">Opening Approvals…</div><script>(async()=>{try{history.replaceState(null,'','/approvals.html#approvals');const r=await fetch('/owner.html',{cache:'no-store'});if(!r.ok)throw new Error(`Owner UI HTTP ${r.status}`);const html=await r.text();document.open();document.write(html);document.close();const force=()=>{try{if(typeof window.setView==='function')window.setView('approvals');else{document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id==='view-approvals'));document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view==='approvals'));const t=document.getElementById('pageTitle');if(t)t.textContent='Approvals';}}catch(e){console.error(e)}};setTimeout(force,0);setTimeout(force,100);document.addEventListener('click',e=>{const b=e.target.closest?.('[data-view]');if(!b)return;try{if(typeof window.setView==='function'){e.preventDefault();window.setView(b.dataset.view)}}catch(err){console.error(err)}},true)}catch(e){document.body.innerHTML=`<div class="boot">Could not open Approvals: ${String(e.message||e)}</div>`}})()</script></body></html>
