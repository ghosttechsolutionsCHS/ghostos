<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GhostOS Monday Marketing Launch</title><style>body{margin:0;background:#090c12;color:#f5f7fb;font:14px/1.45 system-ui,sans-serif}.wrap{max-width:1400px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.auth{display:flex;gap:8px}.auth input{background:#111722;border:1px solid #2b3445;color:#fff;border-radius:8px;padding:9px}.btn{border:0;border-radius:8px;padding:9px 12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#121722;border:1px solid #2a3242;border-radius:13px;padding:14px;margin-bottom:12px}.metric b{display:block;font-size:24px}.muted{color:#909aac}.good{color:#6fe09c}.warn{color:#f1c45b}.bad{color:#ef7c7c}.item{padding:10px 0;border-bottom:1px solid #293142}.item:last-child{border:0}.pill{display:inline-block;padding:3px 7px;border:1px solid #39465c;border-radius:99px;font-size:11px}.money{font-size:28px;font-weight:900}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid #293142}th{color:#909aac;font-size:11px}@media(max-width:900px){.grid,.two{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid,.two{grid-template-columns:1fr}.top{align-items:stretch;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><h1>ATLAS Monday Marketing Brief</h1><div class="muted">Charleston / North Charleston · profitable completed jobs first</div></div><div class="auth"><input id="key" type="password" placeholder="GhostOS key"><button class="btn" id="load">Load</button></div></div><div id="err" class="bad"></div><div id="app"></div></div><script>const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=v=>v==null?'Not available':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(v);let key=sessionStorage.getItem('ghostosKey')||'';$('key').value=key;function metric(k,v){return `<div class="card metric"><span class="muted">${esc(k)}</span><b>${esc(v)}</b></div>`}function render(d){const m=d.metrics,p=d.paidAcquisition||{},plan=p.plan||{},perf=p.performance||{};$('app').innerHTML=`<div class="grid">${metric('New leads',m.newLeads)}${metric('Booked jobs',m.bookedJobs)}${metric('Completed jobs',m.completedJobs)}${metric('Spend',money(m.spend))}${metric('Revenue',money(m.revenue))}${metric('Parts cost',money(m.partsCost))}${metric('Gross profit',money(m.grossProfit))}${metric('CAC',money(m.cac))}</div><div class="two"><div><div class="card"><h2>Today’s marketing actions</h2>${d.todayActions.map(x=>`<div class="item"><b>${esc(x.agent)}</b><div>${esc(x.action)}</div></div>`).join('')}</div><div class="card"><h2>Prepared paid campaign</h2><div class="pill">${esc(plan.status)}</div><p><b>${esc(plan.name)}</b></p><p>${esc(plan.geography)}</p><p>Operating target: <b>$${plan.dailyTarget.min}–$${plan.dailyTarget.max}/day</b> · hard ceiling <b>$${plan.weeklyHardCeiling}/week</b></p><p>${esc(plan.objective)}</p><div class="muted">Live Windsor status: ${esc(perf.status||'Unknown')} · spend ${esc(money(perf.spend))}</div><p class="warn">No Google Ads write/launch action exists in this PR.</p></div><div class="card"><h2>ECHO organic queue</h2>${d.organicContentQueue.map(x=>`<div class="item"><b>${esc(x.title)}</b> <span class="pill">${esc(x.channel)}</span><div>${esc(x.draft)}</div>${x.requiresRealAsset?'<div class="warn">Requires a real repair asset before posting.</div>':''}</div>`).join('')}</div></div><div><div class="card"><h2>SCOUT free opportunities</h2>${d.freeAcquisitionQueue.map(x=>`<div class="item"><b>#${x.rank} ${esc(x.channel)}</b><div>${esc(x.opportunity)}</div><div class="muted">${esc(x.why)}</div>${x.ruleCheckRequired?'<div class="warn">Verify current platform/group rules before posting.</div>':''}</div>`).join('')}</div><div class="card"><h2>BEACON funnel fixes</h2>${d.beacon.fixes.length?d.beacon.fixes.map(x=>`<div class="item"><b>${esc(x.source)}</b> <span class="pill">${esc(x.severity)}</span><div>${esc(x.finding)}</div><div class="good">Next: ${esc(x.action)}</div></div>`).join(''):'<div class="muted">No verified funnel findings are available yet.</div>'}</div><div class="card"><h2>HORIZON profit attribution</h2><table><thead><tr><th>Source</th><th>Leads</th><th>Booked</th><th>Completed</th><th>Revenue</th><th>Gross profit</th></tr></thead><tbody>${d.horizon.attribution.map(x=>`<tr><td>${esc(x.source)}</td><td>${x.leads}</td><td>${x.bookedJobs}</td><td>${x.completedJobs}</td><td>${money(x.revenue)}</td><td>${money(x.grossProfit)}</td></tr>`).join('')}</tbody></table></div><div class="card"><h2>Owner attention</h2>${d.ownerAttention.map(x=>`<div class="item warn">${esc(x)}</div>`).join('')}</div></div></div><div class="card muted">Boundaries: Google Ads writes ${d.boundaries.googleAdsWrites?'enabled':'disabled'} · organic auto-publish ${d.boundaries.organicAutoPublish?'enabled':'disabled'} · automatic purchases ${d.boundaries.automaticPurchases?'enabled':'disabled'} · RELAY manual send ${d.boundaries.relayManualSend?'preserved':'not confirmed'}.</div>`}async function load(){try{$('err').textContent='';key=$('key').value.trim();sessionStorage.setItem('ghostosKey',key);const r=await fetch('/api/monday-marketing',{headers:{'x-ghostos-secret':key}});const j=await r.json();if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);render(j.data)}catch(e){$('err').textContent=e.message}}$('load').onclick=load;if(key)load();</script></body></html>
