<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GhostOS Online</title>
<meta name="description" content="Status page for GhostOS, the agentic backend for Ghost Tech Solutions." />
<meta name="robots" content="noindex" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem;
    background: #0b0f14;
    color: #e6edf3;
    font: 400 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { width: 100%; max-width: 34rem; text-align: center; }
  .mark {
    font-size: 2.75rem;
    line-height: 1;
    margin: 0 0 1.25rem;
  }
  h1 {
    font-size: clamp(1.75rem, 6vw, 2.5rem);
    letter-spacing: -0.02em;
    margin: 0 0 0.75rem;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.35rem 0.85rem;
    border: 1px solid #1f6feb55;
    border-radius: 999px;
    background: #1f6feb14;
    color: #9ecbff;
    font-size: 0.8125rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .dot {
    width: 0.5rem;
    height: 0.5rem;
    border-radius: 50%;
    background: #3fb950;
    box-shadow: 0 0 0 0.25rem #3fb95022;
  }
  .dot[data-state="checking"] { background: #d29922; box-shadow: 0 0 0 0.25rem #d2992222; }
  .dot[data-state="down"]     { background: #f85149; box-shadow: 0 0 0 0.25rem #f8514922; }
  p { color: #8b949e; margin: 1.25rem 0 0; }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.875em;
    color: #c9d1d9;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 0.15em 0.4em;
  }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">👻</div>
    <h1>GhostOS Online</h1>
    <span class="pill"><span class="dot" data-state="checking" id="dot"></span><span id="label">Checking endpoint</span></span>
    <p>Agentic backend for Ghost Tech Solutions.<br />Lead webhook: <code>/api/ghostos</code></p>
  </main>
  <script>
    // Live probe of the function so this page reflects real endpoint health.
    fetch('/.netlify/functions/ghostos', { method: 'GET', cache: 'no-store' })
      .then(function (res) { return res.ok ? 'up' : 'down'; })
      .catch(function () { return 'down'; })
      .then(function (state) {
        document.getElementById('dot').dataset.state = state;
        document.getElementById('label').textContent =
          state === 'up' ? 'Webhook endpoint healthy' : 'Webhook endpoint unreachable';
      });
  </script>
</body>
</html>
