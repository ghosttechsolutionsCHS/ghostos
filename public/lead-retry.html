<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GhostOS Lead Retry</title><style>body{font:15px system-ui;background:#090c12;color:#f5f7fb;margin:0;padding:24px}.card{max-width:650px;margin:auto;background:#151a23;border:1px solid #2b3445;border-radius:14px;padding:18px}input,button{width:100%;box-sizing:border-box;margin:6px 0;padding:12px;border-radius:9px;border:1px solid #323d50;background:#0d1118;color:#fff}button{background:#fff;color:#080a0e;font-weight:800;cursor:pointer}.muted{color:#9ba6b6}.result{white-space:pre-wrap;margin-top:12px}</style></head><body><div class="card"><h2>Process / Retry Lead</h2><p class="muted">Authenticated owner recovery control. It is idempotent: existing RELAY drafts/results are reconciled instead of duplicated. No customer message is sent.</p><input id="key" type="password" placeholder="GhostOS key"><input id="record" placeholder="Airtable lead record ID (rec...)"><button id="run">Process / Retry Lead</button><div id="result" class="result"></div></div><script>const key=document.getElementById('key'),record=document.getElementById('record'),result=document.getElementById('result');key.value=sessionStorage.getItem('ghostosKey')||'';document.getElementById('run').onclick=async()=>{result.textContent='Processing…';const secret=key.value.trim();sessionStorage.setItem('ghostosKey',secret);try{const r=await fetch('/api/lead-dispatch',{method:'POST',headers:{'content-type':'application/json','x-ghostos-secret':secret},body:JSON.stringify({recordId:record.value.trim(),force:true})});const d=await r.json();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);result.textContent=JSON.stringify(d,null,2)}catch(e){result.textContent='Error: '+e.message}};</script></body></html>
