<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GhostOS Marketing Approval</title><style>body{margin:0;background:#080b10;color:#f6f7fb;font:15px/1.45 system-ui,-apple-system,sans-serif}.wrap{max-width:820px;margin:auto;padding:18px 14px 70px}.top{display:flex;gap:10px;justify-content:space-between;align-items:center}.auth{display:flex;gap:7px}.auth input,.edit{background:#111722;color:#fff;border:1px solid #2c3545;border-radius:10px;padding:10px;width:100%}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800}.approve{background:#75e59b}.reject{background:#f28b82}.save{background:#9dc4ff}.card{background:#111722;border:1px solid #293244;border-radius:16px;padding:15px;margin:12px 0}.muted{color:#96a0b2}.pill{display:inline-block;border:1px solid #3a465c;border-radius:99px;padding:3px 8px;font-size:11px;margin:2px}.creative{background:#0b1018;border:1px dashed #3c4960;border-radius:12px;padding:12px;margin:10px 0;white-space:pre-wrap}.caption{white-space:pre-wrap;font-size:16px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions .save{grid-column:1/-1}.money{font-weight:900}.good{color:#7de39f}.warn{color:#f3ca66}.bad{color:#f28b82}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.metric{background:#0d121b;border-radius:10px;padding:10px}.metric b{display:block;font-size:20px}@media(max-width:650px){.top{align-items:stretch;flex-direction:column}.metrics{grid-template-columns:1fr 1fr}.auth{width:100%}.auth input{min-width:0}.actions{position:relative}}</style></head><body><div class="wrap"><div class="top"><div><h1 style="margin:0">Owner Marketing Approval</h1><div class="muted">Only the decisions that need you.</div></div><div class="auth"><input id="key" type="password" placeholder="GhostOS key"><button class="btn" id="load">Load</button></div></div><div id="err" class="bad"></div><div id="app"></div></div><script>const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=v=>v==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(v);let key=sessionStorage.getItem('ghostosKey')||'';$('key').value=key;function name(v){return typeof v==='string'?v:(v&&v.name)||''}function render(d){const s=d.summary||{};$('app').innerHTML=`<div class="card"><h2>${esc(d.greeting)}</h2><div class="metrics"><div class="metric">Needs you<b>${s.pending||0}</b></div><div class="metric">New leads<b>${s.newLeads||0}</b></div><div class="metric">Booked<b>${s.bookedJobs||0}</b></div><div class="metric">Gross profit<b>${money(s.grossProfit)}</b></div></div></div><div class="card"><b>Google Ads</b><div>${esc(d.advertising.googleAds.status)}</div><div class="muted">Authorized ceiling: $10/day · $70 first 7 days · ~25-mile Charleston/North Charleston area.</div><div class="warn">No ad-account write connection is available yet, so approval cannot be represented as a launch.</div></div>${d.items.length?d.items.map(card).join(''):'<div class="card muted">Nothing is waiting for owner approval right now.</div>'}`}
function card(r){const f=r.fields||{},decision=name(f['Owner Decision'])||'Pending',pending=decision==='Pending',draft=f['Owner Edit']||f['Draft Content']||'';return `<div class="card"><div><span class="pill">${esc(f.Agent||'ATLAS')}</span><span class="pill">${esc(f.Platform||'Marketing')}</span><span class="pill">${esc(f['Content Type']||f['Work Type']||'Decision')}</span></div><h2>${esc(f['Growth Item']||'Marketing item')}</h2><div>${esc(f.Purpose||f['Latest Result']||'')}</div>${f['Creative Asset URL']?`<p><a class="good" target="_blank" href="${esc(f['Creative Asset URL'])}">Open creative asset</a></p>`:''}${f['Creative Brief']?`<div class="creative"><b>Creative</b>\n${esc(f['Creative Brief'])}</div>`:''}${draft?`<div class="caption">${esc(draft)}</div>`:''}${f.CTA?`<p><b>CTA:</b> ${esc(f.CTA)}</p>`:''}${f.Hashtags?`<p class="muted">${esc(f.Hashtags)}</p>`:''}${f['Recommended Posting Time']?`<p><b>Recommended:</b> ${esc(f['Recommended Posting Time'])}</p>`:''}${f['Group Rules']?`<div class="creative"><b>Group rules found</b>\n${esc(f['Group Rules'])}\nConfidence: ${esc(name(f['Posting Confidence']))}</div>`:''}${f['Evidence URL']?`<p><a class="good" target="_blank" href="${esc(f['Evidence URL'])}">Evidence / group link</a></p>`:''}${f['Money Involved']!=null?`<p class="money">Money involved: ${money(f['Money Involved'])}</p>`:''}<div class="muted">Status: ${esc(decision)}${f['Publishing Status']?` · ${esc(name(f['Publishing Status']))}`:''}</div>${pending?`<textarea class="edit" id="e-${r.id}" rows="4" placeholder="Optional edit before approval">${esc(draft)}</textarea><div class="actions"><button class="btn approve" onclick="decide('${r.id}','Approved')">APPROVE</button><button class="btn reject" onclick="decide('${r.id}','Rejected')">REJECT</button><button class="btn save" onclick="decide('${r.id}','Approved',true)">APPROVE EDITED VERSION</button></div>`:''}</div>`}
async function api(method='GET',body){const r=await fetch('/api/marketing-approval',{method,headers:{'x-ghostos-secret':key,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);return j.data}async function load(){try{$('err').textContent='';key=$('key').value.trim();sessionStorage.setItem('ghostosKey',key);render(await api())}catch(e){$('err').textContent=e.message}}async function decide(id,decision,edited=false){try{const edit=edited?($(`e-${id}`).value||''):'';await api('POST',{id,decision,edit});await load()}catch(e){$('err').textContent=e.message}}$('load').onclick=load;if(key)load();</script></body></html>
